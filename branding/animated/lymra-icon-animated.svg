<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 384 384" role="img" aria-labelledby="title">
<title id="title">Lymra</title>
<style>
.push { animation: 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite both; transform-box: fill-box; }
.push-0 { animation-name: push-0; }
.push-1 { animation-name: push-1; }
.push-2 { animation-name: push-2; }
@keyframes push-0 {
0%, 10% { opacity: 0; transform: translateY(-48px); fill: #F5A524; }
18%, 28% { opacity: 1; transform: none; fill: #F5A524; }
36%, 80% { opacity: 1; transform: none; fill: #E8452C; }
84%, 100% { opacity: 0; transform: none; fill: #E8452C; }
}
@keyframes push-1 {
0%, 28% { opacity: 0; transform: translateY(-48px); fill: #F5A524; }
36%, 46% { opacity: 1; transform: none; fill: #F5A524; }
54%, 80% { opacity: 1; transform: none; fill: #E8452C; }
84%, 100% { opacity: 0; transform: none; fill: #E8452C; }
}
@keyframes push-2 {
0%, 46% { opacity: 0; transform: translateY(-48px); fill: #F5A524; }
54%, 80% { opacity: 1; transform: none; fill: #F5A524; }
84%, 100% { opacity: 0; transform: none; fill: #F5A524; }
}
@media (prefers-reduced-motion: reduce) { .push { animation: none; } }
</style>
