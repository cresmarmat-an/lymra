name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        # Linux, macOS and Windows, each on x86-64 and on ARM64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The tests build every program with each C compiler they find, so on Windows MSVC joins GCC and Clang.
      - name: Make MSVC available
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Show the C compilers
        shell: bash
        run: |
          gcc --version || echo "gcc is not installed"
          clang --version || echo "clang is not installed"
          if command -v cl > /dev/null; then cl 2>&1 | head -n 1 || true; else echo "cl is not installed"; fi
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  thirty-two-bit:
    name: Test 32-bit programs on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the 32-bit C library
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # With CC set, every program is also built as 32-bit code, and has to behave exactly as the 64-bit builds do.
      - name: Test
        run: cargo test
        env:
          CC: gcc -m32

  freebsd:
    name: Test on FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: |
            cc --version
            cargo test

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  minimum-rust:
    name: Test on Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test
